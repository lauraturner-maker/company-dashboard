<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dell Technologies – Market Ticker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Roboto+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:         #0a0f1c;
    --panel:      #0d1423;
    --border:     #1a2540;
    --dell-blue:  #007DB8;
    --dell-blue2: #005F8E;
    --green:      #00C389;
    --red:        #F5222D;
    --amber:      #FAA619;
    --white:      #E8EDF5;
    --muted:      #3D5470;
    --glow-green: 0 0 6px rgba(0,195,137,0.45);
    --glow-red:   0 0 6px rgba(245,34,45,0.45);
  }

  body {
    background: var(--bg);
    font-family: 'Roboto Condensed', sans-serif;
    overflow: hidden;
    height: 56px;
    display: flex;
    align-items: center;
  }

  .ticker-wrap {
    width: 100%;
    height: 56px;
    background: var(--panel);
    border-top: 2px solid var(--dell-blue);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  /* ── Dell logo badge ── */
  .ticker-label {
    flex-shrink: 0;
    background: var(--dell-blue);
    color: #fff;
    font-family: 'Roboto Condensed', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 2.5px;
    padding: 0 16px 0 14px;
    height: 100%;
    display: flex;
    align-items: center;
    text-transform: uppercase;
    z-index: 10;
    white-space: nowrap;
    gap: 10px;
    position: relative;
  }

  /* Angled right edge */
  .ticker-label::after {
    content: '';
    position: absolute;
    right: -14px;
    top: 0;
    width: 0;
    height: 0;
    border-top: 56px solid transparent;
    border-left: 14px solid var(--dell-blue);
  }

  /* Dell "D" wordmark circle SVG inline */
  .dell-logo {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
  }

  .label-text {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }
  .label-top { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; }
  .label-sub { font-size: 9px; letter-spacing: 2px; opacity: 0.75; font-weight: 400; }

  /* Live indicator */
  .live-badge {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 9px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.9);
    background: rgba(0,0,0,0.25);
    padding: 3px 7px;
    border-radius: 2px;
    border: 1px solid rgba(255,255,255,0.15);
    margin-left: 4px;
  }

  .pulse-dot {
    width: 6px;
    height: 6px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 1.4s ease-in-out infinite;
    box-shadow: 0 0 5px rgba(0,195,137,0.7);
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.35; transform: scale(0.65); }
  }

  /* ── Scrolling track ── */
  .ticker-scroll-outer {
    flex: 1;
    overflow: hidden;
    height: 100%;
    position: relative;
    padding-left: 22px;
  }

  .ticker-scroll-outer::before {
    content: '';
    position: absolute;
    left: 0; top: 0;
    width: 32px; height: 100%;
    background: linear-gradient(to right, var(--panel), transparent);
    z-index: 5;
    pointer-events: none;
  }

  .ticker-scroll-outer::after {
    content: '';
    position: absolute;
    right: 0; top: 0;
    width: 60px; height: 100%;
    background: linear-gradient(to right, transparent, var(--panel));
    z-index: 5;
    pointer-events: none;
  }

  .ticker-track {
    display: flex;
    align-items: center;
    height: 100%;
    white-space: nowrap;
    animation: ticker-scroll 50s linear infinite;
    will-change: transform;
  }

  .ticker-track:hover { animation-play-state: paused; }

  @keyframes ticker-scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* ── Stock item ── */
  .stock-item {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 0 26px 0 0;
    cursor: default;
    transition: opacity 0.15s;
    user-select: none;
  }

  .stock-item:hover { opacity: 0.7; }

  .stock-symbol {
    font-family: 'Roboto Condensed', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.8px;
    color: var(--white);
  }

  /* Highlight DELL in blue */
  .stock-symbol.highlight {
    color: var(--dell-blue);
    text-shadow: 0 0 12px rgba(0,125,184,0.5);
  }

  .stock-price {
    font-family: 'Roboto Mono', monospace;
    font-size: 13px;
    color: #8aa4c0;
    letter-spacing: 0.3px;
  }

  .stock-change {
    font-family: 'Roboto Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 2px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    letter-spacing: 0.2px;
  }

  .stock-change.up {
    color: var(--green);
    background: rgba(0,195,137,0.09);
    text-shadow: var(--glow-green);
    border: 1px solid rgba(0,195,137,0.18);
  }

  .stock-change.down {
    color: var(--red);
    background: rgba(245,34,45,0.08);
    text-shadow: var(--glow-red);
    border: 1px solid rgba(245,34,45,0.18);
  }

  .stock-change.flat {
    color: var(--amber);
    background: rgba(250,166,25,0.08);
    border: 1px solid rgba(250,166,25,0.18);
  }

  /* Divider */
  .stock-divider {
    display: inline-block;
    width: 1px;
    height: 22px;
    background: var(--border);
    margin-right: 26px;
    vertical-align: middle;
    opacity: 0.8;
  }

  /* ── Timestamp ── */
  .ticker-time {
    flex-shrink: 0;
    font-family: 'Roboto Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    padding: 0 14px;
    white-space: nowrap;
    letter-spacing: 0.5px;
    border-left: 1px solid var(--border);
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    gap: 2px;
    line-height: 1.3;
  }

  .time-label { color: #4e6a8a; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; }
</style>
</head>
<body>

<div class="ticker-wrap">

  <!-- Dell badge -->
  <div class="ticker-label">
    <!-- Dell logo SVG -->
    <svg class="dell-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Dell">
      <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="5"/>
      <text x="50" y="68" text-anchor="middle"
            font-family="'Roboto Condensed', sans-serif"
            font-weight="700" font-size="52" fill="#fff">D</text>
    </svg>
    <div class="label-text">
      <span class="label-top">DELL</span>
      <span class="label-sub">Technologies</span>
    </div>
    <div class="live-badge">
      <div class="pulse-dot"></div>
      LIVE
    </div>
  </div>

  <!-- Scrolling track -->
  <div class="ticker-scroll-outer">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>

  <!-- Clock -->
  <div class="ticker-time" id="tickerTime">
    <span class="time-label">NASDAQ</span>
    <span id="timeDisplay">—</span>
  </div>
</div>

<script>
  const stocks = [
    { symbol: "DELL",  price: 124.57,  change: +2.34,  pct: +1.91, highlight: true  },
    { symbol: "IBM",   price: 232.47,  change: +1.83,  pct: +0.79  },
    { symbol: "AAPL",  price: 189.52,  change: +2.14,  pct: +1.14  },
    { symbol: "MSFT",  price: 415.38,  change: -3.21,  pct: -0.77  },
    { symbol: "GOOGL", price: 173.91,  change: +0.57,  pct: +0.33  },
    { symbol: "AMZN",  price: 198.64,  change: -1.45,  pct: -0.72  },
    { symbol: "NVDA",  price: 875.12,  change: +18.43, pct: +2.15  },
    { symbol: "META",  price: 521.77,  change: +4.92,  pct: +0.95  },
    { symbol: "TSLA",  price: 172.34,  change: -6.88,  pct: -3.84  },
    { symbol: "HPQ",   price: 33.41,   change: -0.22,  pct: -0.65  },
    { symbol: "CRM",   price: 302.88,  change: +3.11,  pct: +1.04  },
    { symbol: "INTC",  price: 41.22,   change: -0.58,  pct: -1.39  },
    { symbol: "AMD",   price: 163.05,  change: +5.70,  pct: +3.62  },
    { symbol: "JPM",   price: 207.15,  change: +1.02,  pct: +0.49  },
    { symbol: "V",     price: 285.40,  change: +0.00,  pct:  0.00  },
  ];

  function renderItem(s) {
    const dir    = s.change > 0 ? 'up' : s.change < 0 ? 'down' : 'flat';
    const arrow  = s.change > 0 ? '▲' : s.change < 0 ? '▼' : '■';
    const sign   = s.change > 0 ? '+' : '';
    const pctStr = `${sign}${s.pct.toFixed(2)}%`;
    const chgStr = `${sign}${Math.abs(s.change).toFixed(2)}`;
    const symClass = s.highlight ? 'stock-symbol highlight' : 'stock-symbol';

    return `
      <span class="stock-item" data-symbol="${s.symbol}">
        <span class="${symClass}">${s.symbol}</span>
        <span class="stock-price">$${s.price.toFixed(2)}</span>
        <span class="stock-change ${dir}">${arrow} ${chgStr}&nbsp;&nbsp;${pctStr}</span>
      </span>
      <span class="stock-divider"></span>`;
  }

  function buildTrack() {
    const html  = stocks.map(renderItem).join('');
    document.getElementById('tickerTrack').innerHTML = html + html;
  }

  function driftPrices() {
    stocks.forEach(s => {
      const delta = (Math.random() - 0.50) * (s.highlight ? 0.18 : 0.25);
      s.price     = Math.max(1, s.price + delta);
      s.change   += delta;
      s.pct       = (s.change / (s.price - s.change)) * 100;
    });
    buildTrack();
  }

  function updateTime() {
    const now  = new Date();
    const time = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const date = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    document.getElementById('timeDisplay').textContent = `${date}  ${time}`;
  }

  buildTrack();
  updateTime();
  setInterval(updateTime, 1000);
  setInterval(driftPrices, 5000);
</script>
</body>
</html>
